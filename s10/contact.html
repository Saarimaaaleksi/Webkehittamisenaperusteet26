<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">
                centria <span>edu</span>
            </div>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#topics">Topics</a></li>
                <li><a href="#">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>

    <section class="hero">
        <div class="container">
            <div class="hero-content">

                <span class="label">Get in touch with us</span>

                <h1>
                    Contact Us Below.
                </h1>

                <p>
                    Have questions or feedback? We'd love to hear from you!
                </p>


            </div>
        </div>
    </section>

    <section class="topics" id="contact">
<div class="container">
    <h2>Contact us</h2>
    <h4>Fill out the form below to get in touch with us.</h4>

    
<form class="card"
      action="https://httpbin.org/post"
      method="post">

    <!-- Nimi -->
    <label for="name">Nimi *</label>
    <input type="text" id="name" name="name" required>

    <!-- Sähköposti -->
    <label for="email">Sähköpostiosoite *</label>
    <input type="email" id="email" name="email" required>

    <!-- Puhelinnumero -->
    <label for="phone">Puhelinnumero</label>
    <input type="tel" id="phone" name="phone">

    <!-- Yhteydenoton aihe -->
    <label for="subject">Yhteydenoton aihe *</label>
    <select id="subject" name="subject" required>
        <option value="">Valitse aihe</option>
        <option value="question">Kysymys</option>
        <option value="feedback">Palaute</option>
        <option value="other">Muu asia</option>
    </select>

    <!-- Yhteydenottotapa -->
    <fieldset>
        <legend>Toivottu yhteydenottotapa</legend>

        <label>
            <input type="radio" name="contact_method"
                   value="email" checked>
            Sähköposti
        </label>

        <label>
            <input type="radio" name="contact_method"
                   value="phone">
            Puhelin
        </label>
    </fieldset>

    <!-- Viesti -->
    <label for="message">Viesti *</label>
    <textarea id="message" name="message"
              rows="5" required></textarea>

    <!-- Lähetys -->
    <button type="submit">Lähetä viesti</button>

</form>
</div>
</section>

</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Centria Edu</p>
    </div>
</footer>

</body>
</html>
